<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boardvision - Xadrez</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <!-- Painel Superior: Onde a coordenada sorteada aparece em destaque (US03) -->
    <header id="painel-topo">
        <h1>Boardvision ♟️</h1>
        <p>Encontre a casa: <strong id="coordenada-alvo">--</strong></p>

        <!--Botão provisório apenas para testar o sorteio antes do tabuleiro ficar pronto-->
        <button id="btn-testar-sorteio">Sortear Próxima casa</button>
    </header>

    <!-- Área reservada para o Front-End construir o Tabuleiro 8x8 na US02 -->
    <!-- O novo embrulho que gere a posição das coordenadas e do tabuleiro -->
    <div class="tabuleiro-wrapper">
        <!-- Barra lateral esquerda (números de 8 a 1 descendo·)-->
         <div class="coordenadas-numeros">
            <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
         </div>

         <!-- O container alvo onde o seu JS vai injetar as 64 casas dinamicamente-->
          <div id="tabuleiro-container"></div>

          <!-- Barra inferior (letras de a até h)-->
           <div class="coordenadas-letras">
            <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
           </div>
    </div>

    <!--Importação do script principal de lógica-->
    <script type="module" src="./js/main.js"></script>
</body>

</html>
